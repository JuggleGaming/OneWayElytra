name: Build & Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Prepare release JAR
        run: |
          mkdir -p release

          ORIGINAL_JAR=$(find target -maxdepth 1 -type f -name "*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            | head -n 1)

          cp "$ORIGINAL_JAR" "release/OneWayElytra-${GITHUB_REF_NAME}.jar"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneWayElytra
          path: release/OneWayElytra-${{ github.ref_name }}.jar

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: OneWayElytra
          path: release

      - name: Read changelog
        id: changelog
        run: |
          if [ -f changelog.md ]; then
            {
              echo "CHANGELOG<<EOF"
              cat changelog.md
              echo "EOF"
            } >> $GITHUB_ENV
          else
            {
              echo "CHANGELOG<<EOF"
              echo "No changelog available."
              echo "EOF"
            } >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Automated release notes for version ${{ github.ref_name }}

            ## Changelog
            ${{ env.CHANGELOG }}
          files: |
            release/OneWayElytra-${{ github.ref_name }}.jar

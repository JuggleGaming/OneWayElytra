name: Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Prepare release JAR
        run: |
          mkdir -p release
          ORIGINAL_JAR=$(find target -maxdepth 1 -type f -name "*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            | head -n 1)
          VERSION=$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.*)<\/version>.*/\1/')
          cp "$ORIGINAL_JAR" "release/OneWayElytra-${VERSION}.jar"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # Wichtig: Wir laden den gesamten release-Ordner hoch, um die Struktur zu behalten
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneWayElytra-Artifact
          path: release/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: OneWayElytra-Artifact
          path: release

      - name: Read changelog
        run: |
          if [ -f changelog.md ]; then
            {
              echo "CHANGELOG<<EOF"
              cat changelog.md
              echo "EOF"
            } >> $GITHUB_ENV
          else
            {
              echo "CHANGELOG<<EOF"
              echo "No changelog available."
              echo "EOF"
            } >> $GITHUB_ENV
          fi

      # Version auslesen und für GitHub Actions Syntax verfügbar machen
      - name: Read version from pom.xml
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.*)<\/version>.*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # Bereinigung via GitHub CLI (löscht Release UND das Tag auf GitHub sauber)
      - name: Delete existing release and tag if present
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ env.VERSION }}" --yes --cleanup-tag

      # Das Erstellen des Tags übernimmt softprops/action-gh-release automatisch!
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          target_commitish: main
          body: |
            Automated release notes for version ${{ env.VERSION }}

            ## Changelog
            ${{ env.CHANGELOG }}
          files: |
            release/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
